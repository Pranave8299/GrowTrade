
server:
  port: 8086

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5432/trading
    username: trading
    password: trading_local
    hikari:
      data-source-properties:
        options: "-c TimeZone=UTC"

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: user_service
        jdbc:
          time_zone: UTC
    show-sql: true
    open-in-view: false

  flyway:
    enabled: true
    schemas: user_service
    default-schema: user_service
    create-schemas: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000
