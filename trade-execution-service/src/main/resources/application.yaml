
  server:
    port: 8082

  spring:
    application:
      name: trade-execution-service

    datasource:
      url: jdbc:postgresql://localhost:5432/trading
      username: trading
      password: trading_local
      hikari:
        data-source-properties:
          options: "-c TimeZone=UTC"

    jpa:
      hibernate:
        ddl-auto: validate
      properties:
        hibernate:
          default_schema: trade_execution
          jdbc:
            time_zone: UTC
      show-sql: true
      open-in-view: false

    kafka:
      bootstrap-servers: localhost:9092

      # Kafka Producer Configuration
      producer:
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

      # Kafka Consumer Configuration
      consumer:
        group-id: trade-execution-group
        auto-offset-reset: earliest
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
        properties:
          "[spring.deserializer.value.delegate.class]": org.springframework.kafka.support.serializer.JsonDeserializer
          "[spring.json.trusted.packages]": "com.growtrade.execution.event"
          "[spring.json.value.default.type]": "com.growtrade.execution.event.OrderCreatedEvent"
          "[spring.json.use.type.headers]": "false"

    flyway:
      enabled: true
      schemas: trade_execution
      default-schema: trade_execution
      create-schemas: true
      locations: classpath:db/migration
