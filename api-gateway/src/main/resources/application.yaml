
server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: false

          routes:
            - id: user-service
              uri: http://localhost:8086
              predicates:
                - Path=/api/auth/**,/api/users/**

            - id: order-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/orders/**

            - id: market-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/stocks/**

            - id: portfolio-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/portfolio/**

            - id: wallet-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/wallets/**

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET}
