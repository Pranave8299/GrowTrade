
server:
  port: 8085

spring:
  application:
    name: wallet-service

  datasource:
    url: jdbc:postgresql://localhost:5432/trading
    username: trading
    password: trading_local
    hikari:
      data-source-properties:
        options: "-c TimeZone=UTC"

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: wallet
        jdbc:
          time_zone: UTC
    show-sql: true
    open-in-view: false

  flyway:
    enabled: true
    schemas: wallet
    default-schema: wallet
    create-schemas: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: wallet-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.growtrade.wallet.event"
        spring.json.value.default.type: com.growtrade.wallet.event.TradeExecutedEvent
        spring.json.use.type.headers: false
