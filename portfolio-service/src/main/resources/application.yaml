
server:
  port: 8084

spring:
  application:
    name: portfolio-service

  datasource:
    url: jdbc:postgresql://localhost:5432/trading
    username: trading
    password: trading_local
    hikari:
      data-source-properties:
        options: "-c TimeZone=UTC"

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: portfolio
        jdbc:
          time_zone: UTC
    show-sql: true
    open-in-view: false

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: portfolio-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        "[spring.deserializer.value.delegate.class]": org.springframework.kafka.support.serializer.JsonDeserializer
        "[spring.json.trusted.packages]": "com.growtrade.portfolio.event"
        "[spring.json.value.default.type]": "com.growtrade.portfolio.event.TradeExecutedEvent"
        "[spring.json.use.type.headers]": "false"

  flyway:
    enabled: true
    schemas: portfolio
    default-schema: portfolio
    create-schemas: true
    locations: classpath:db/migration

logging:
  level:
    org.springframework.kafka: INFO
    org.hibernate.SQL: DEBUG
